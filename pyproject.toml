[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adt-dummy"
version = "0.1.0"
description = "Internal toolbox CLI"
readme = "README.md"
requires-python = "==3.9.12"
authors = [{ name = "Ivan Romanenko", email = "ivan.romanenko@raiffeisen.ru" }]
maintainers = [{ name = "Ivan Romanenko", email = "ivan.romanenko@raiffeisen.ru" }]

dependencies = [
  "trino==0.326.0",
  "urllib3==1.26.18",
  "requests==2.31.0",
  "click==8.1.7",
  "tabulate==0.9.0",
  "confluent-kafka==1.6.1",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "regex==2024.5.15",
  "python-dotenv==1.2.1",
  "fastavro==1.12.1",
  "redis==7.0.1",
  "fakeredis==2.33.0",
]

[dependency-groups]

dev = [
  "pre-commit==3.7.1",
  "black==25.1.0",
  "isort==6.0.1",
]

test = [
  "pytest==8.4.2",
  "pytest-cov==4.1.0",
]

[tool.uv]
# Отключаем сборку пакета, если это не библиотека
package = false

# Настройка приватного индекса
[[tool.uv.index]]
name = "raif"
url = "https://artifactory.raiffeisen.ru/artifactory/api/pypi/remote-pypi/simple"
default = true

# ----------------------------------------------------------------------------------------------------------------------
# Настройки инструментов
# ----------------------------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = """
--capture=no
--cov
--cov-report=term-missing
--cov-report=xml
--exitfirst
--junitxml=reports/junit.xml
--verbose
"""

[tool.coverage.run]
source = ["adt_dummy"]
relative_files = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["adt_dummy*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
py_version = 39